name: Build Chrome Extension

on:
  push:
    paths:
      - 'chrome-extension/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: chrome-extension
        run: npm install

      - name: Build extension
        working-directory: chrome-extension
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "chrome-extension/dist" ]; then
            echo "❌ Build failed: chrome-extension/dist/ not found"
            exit 1
          fi
          echo "✅ Build output verified:"
          ls -la chrome-extension/dist/

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelens-extension
          path: chrome-extension/dist/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## ✅ HomeLens Extension — Build concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Como instalar no Chrome (modo Developer):" >> $GITHUB_STEP_SUMMARY
          echo "1. Em **Actions**, abra este workflow e baixe o artifact **homelens-extension** (vem como ZIP)." >> $GITHUB_STEP_SUMMARY
          echo "2. Descompacte o ZIP — \`manifest.json\` deve estar na raiz." >> $GITHUB_STEP_SUMMARY
          echo "3. Em **chrome://extensions**, ative **Developer Mode**, clique em **Load unpacked** e selecione a pasta." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Como subir na Chrome Web Store:" >> $GITHUB_STEP_SUMMARY
          echo "- O ZIP baixado do artifact já está pronto para upload (\`manifest.json\` na raiz)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> A extensão ficará disponível para download por 30 dias." >> $GITHUB_STEP_SUMMARY
